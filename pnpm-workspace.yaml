shellEmulator: true

trustPolicy: no-downgrade

# lockfile 中的 chokidar@4.0.3 / semver@6.3.1 是多年前发布的老包，
# 会被 trustPolicy 误报为 trust downgrade；发布超过 1 天的包豁免该检查
trustPolicyIgnoreAfter: 1440

# 跑脚本前不做自动 install + 供应链校验（pnpm 11 新增行为，会因上述误报阻塞所有脚本）
verifyDepsBeforeRun: false

allowBuilds:
  esbuild: true
  simple-git-hooks: true
